<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <clipPath id="frame"><rect width="1200" height="300" rx="24"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#1b0f3a;#06283d;#0f0c29" dur="10s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#0b4f6c;#5b1a6e;#302b63" dur="10s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="45"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.5" stop-color="#9ff3ff"/>
      <stop offset="1" stop-color="#ffb6f3"/>
    </linearGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
      <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="50 50" dur="3s" repeatCount="indefinite"/>
    </pattern>
    <clipPath id="reveal">
      <rect x="312" y="60" height="130" width="0">
        <animate attributeName="width" calcMode="discrete" dur="3s" fill="freeze" values="0;48;96;144;192;240;288;336;384;432;480;528;576"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="url(#bg)"/>

    <g filter="url(#blur)">
      <circle r="130" fill="#ff3cac" opacity="0.65">
        <animate attributeName="cx" values="150;500;250;150" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;240;260;60" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle r="150" fill="#2b86c5" opacity="0.7">
        <animate attributeName="cx" values="1050;700;900;1050" dur="11s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="240;40;200;240" dur="11s" repeatCount="indefinite"/>
      </circle>
      <circle r="110" fill="#00f5d4" opacity="0.5">
        <animate attributeName="cx" values="600;950;300;600" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;60;120;280" dur="13s" repeatCount="indefinite"/>
      </circle>
      <circle r="120" fill="#784ba0" opacity="0.6">
        <animate attributeName="cx" values="300;850;1100;300" dur="12s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="40;260;80;40" dur="12s" repeatCount="indefinite"/>
      </circle>
    </g>

    <rect width="1200" height="300" fill="url(#grid)"/>

    <circle cx="683" cy="320" r="3" fill="#ffffff"><animate attributeName="cy" from="320" to="-20" dur="7.4s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="7.4s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="908" cy="320" r="4" fill="#a5b4ff"><animate attributeName="cy" from="320" to="-20" dur="5.4s" begin="-0.9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5.4s" begin="-0.9s" repeatCount="indefinite"/></circle>
    <circle cx="141" cy="320" r="2" fill="#ffffff"><animate attributeName="cy" from="320" to="-20" dur="10.7s" begin="-6.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10.7s" begin="-6.3s" repeatCount="indefinite"/></circle>
    <circle cx="832" cy="320" r="2" fill="#7df9ff"><animate attributeName="cy" from="320" to="-20" dur="10.9s" begin="-0.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="10.9s" begin="-0.5s" repeatCount="indefinite"/></circle>
    <circle cx="613" cy="320" r="4" fill="#ff9bf5"><animate attributeName="cy" from="320" to="-20" dur="5.9s" begin="-1.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5.9s" begin="-1.2s" repeatCount="indefinite"/></circle>
    <circle cx="1167" cy="320" r="3" fill="#7df9ff"><animate attributeName="cy" from="320" to="-20" dur="5.6s" begin="-5.7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="5.6s" begin="-5.7s" repeatCount="indefinite"/></circle>
    <circle cx="441" cy="320" r="4" fill="#ff9bf5"><animate attributeName="cy" from="320" to="-20" dur="9.1s" begin="-4.3s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;0.9;0" dur="9.1s" begin="-4.3s" repeatCount="indefinite"/></circle>
