<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
<defs>
<clipPath id="f"><rect width="1200" height="300" rx="24"/></clipPath>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0f0c29"><animate attributeName="stop-color" values="#0f0c29;#1b0f3a;#06283d;#0f0c29" dur="10s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#302b63"><animate attributeName="stop-color" values="#302b63;#0b4f6c;#5b1a6e;#302b63" dur="10s" repeatCount="indefinite"/></stop></linearGradient>
<filter id="b" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="g" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="6" result="x"/><feMerge><feMergeNode in="x"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="n" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset=".5" stop-color="#9ff3ff"/><stop offset="1" stop-color="#ffb6f3"/></linearGradient>
<pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#fff" stroke-opacity=".08"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="50 50" dur="3s" repeatCount="indefinite"/></pattern>
<clipPath id="r"><rect x="312" y="60" height="130" width="0"><animate attributeName="width" calcMode="discrete" dur="3s" fill="freeze" values="0;48;96;144;192;240;288;336;384;432;480;528;576"/></rect></clipPath>
</defs>
<g clip-path="url(#f)">
<rect width="1200" height="300" fill="url(#bg)"/>
<g filter="url(#b)">
<circle r="130" fill="#ff3cac" opacity=".65"><animate attributeName="cx" values="150;500;250;150" dur="9s" repeatCount="indefinite"/><animate attributeName="cy" values="60;240;260;60" dur="9s" repeatCount="indefinite"/></circle>
<circle r="150" fill="#2b86c5" opacity=".7"><animate attributeName="cx" values="1050;700;900;1050" dur="11s" repeatCount="indefinite"/><animate attributeName="cy" values="240;40;200;240" dur="11s" repeatCount="indefinite"/></circle>
<circle r="110" fill="#00f5d4" opacity=".5"><animate attributeName="cx" values="600;950;300;600" dur="13s" repeatCount="indefinite"/><animate attributeName="cy" values="280;60;120;280" dur="13s" repeatCount="indefinite"/></circle>
</g>
<rect width="1200" height="300" fill="url(#grid)"/>
<circle cx="200" cy="320" r="3" fill="#fff"><animate attributeName="cy" from="320" to="-20" dur="7s" repeatCount="indefinite"/></circle>
<circle cx="500" cy="320" r="4" fill="#ff9bf5"><animate attributeName="cy" from="320" to="-20" dur="9s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="320" r="3" fill="#7df9ff"><animate attributeName="cy" from="320" to="-20" dur="6s" repeatCount="indefinite"/></circle>
<circle cx="1100" cy="320" r="4" fill="#a5b4ff"><animate attributeName="cy" from="320" to="-20" dur="8s" repeatCount="indefinite"/></circle>
<g transform="translate(0,255)"><path fill="#fff" fill-opacity=".1" d="M0,0 Q150,-26 300,0 T600,0 T900,0 T1200,0 T1500,0 T1800,0 T2100,0 T2400,0 V80 H0 Z"><animateTransform attributeName="transform" type="translate" from="-600 0" to="0 0" dur="7s" repeatCount="indefinite"/></path></g>
<g transform="translate(0,270)"><path fill="#fff" fill-opacity=".16" d="M0,0 Q150,-20 300,0 T600,0 T900,0 T1200,0 T1500,0 T1800,0 T2100,0 T2400,0 V80 H0 Z"><animateTransform attributeName="transform" type="translate" from="0 0" to="-600 0" dur="5s" repeatCount="indefinite"/></path></g>
<g clip-path="url(#r)" filter="url(#g)"><text x="312" y="155" font-family="'Courier New',Consolas,Menlo,monospace" font-size="80" font-weight="bold" fill="url(#n)" textLength="576" lengthAdjust="spacingAndGlyphs">Farida Ahmed</text></g>
<rect x="312" y="85" width="6" height="85" rx="3" fill="#9ff3ff"><animate attributeName="x" calcMode="discrete" dur="3s" fill="freeze" values="312;360;408;456;504;552;600;648;696;744;792;840;888"/><animate attributeName="opacity" values="1;0;1" dur=".9s" begin="3s" repeatCount="indefinite"/></rect>
</g>
</svg>
